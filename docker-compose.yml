# EN: Full stack - database, Laravel API backend and Vue SPA frontend.
#     Run everything with a single command:  docker compose up -d
# PT: Stack completo - banco, backend (API Laravel) e frontend (SPA Vue).
#     Suba tudo com um único comando:        docker compose up -d

services:
  # --- Database / Banco de dados ---
  db:
    image: mysql:8.0
    container_name: pokedex-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pokedex
      MYSQL_USER: pokedex
      MYSQL_PASSWORD: pokedex
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # EN: Backend waits for this to pass before migrating.
      # PT: O backend espera este check passar antes de migrar.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppokedex", "-u", "pokedex"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - pokedex

  # --- Backend (Laravel 12 / PHP 8.3 API) ---
  backend:
    build:
      context: ./backend
    container_name: pokedex-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Pokedex
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: pokedex
      DB_USERNAME: pokedex
      DB_PASSWORD: pokedex
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      POKEAPI_BASE_URL: https://pokeapi.co/api/v2
    ports:
      - "8000:8000"
    networks:
      - pokedex

  # --- Frontend (Vue 3 SPA served by nginx, proxies /api to backend) ---
  frontend:
    build:
      context: ./frontend
    container_name: pokedex-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - pokedex

volumes:
  db-data:

networks:
  pokedex:
    driver: bridge
