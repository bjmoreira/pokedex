# EN: Serves the built Vue SPA and reverse-proxies /api to the backend.
# PT: Serve o SPA Vue compilado e faz proxy reverso de /api para o backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # EN: Forward API calls to the Laravel backend container.
    # PT: Encaminha chamadas de API para o container do backend Laravel.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # EN: Cache static assets aggressively. / PT: Cacheia assets estáticos de forma agressiva.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # EN: SPA fallback - let Vue Router handle client-side routes.
    # PT: Fallback do SPA - deixa o Vue Router tratar as rotas no cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
